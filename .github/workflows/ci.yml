name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: health_mvp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI 전용 값 (실제 비밀값 아님). LLM 키가 없으므로 템플릿 설명으로 테스트한다.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/health_mvp?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/health_mvp?schema=public
      SESSION_SECRET: ci-only-session-secret-not-used-in-production-000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: DB 마이그레이션
        run: npx prisma migrate deploy

      - name: Lint · 포맷 · 타입 검사 · 단위 테스트
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run test

      - name: DB 통합 테스트
        run: npm run test:db

      # 배포되는 의존성(production)의 high 이상 취약점은 실패로 막는다
      - name: 보안 점검 (배포 의존성)
        run: npm audit --omit=dev --audit-level=high

      # 개발 도구 의존성까지 포함한 전체 점검은 기록용 (패치가 아직 없는 취약점이 있어도 빌드를 막지 않음)
      # 예: braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm) — eslint-config-next 경유, 패치 버전 미배포
      - name: 보안 점검 (전체, 참고용)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 빌드
        run: npm run build

      - name: E2E 테스트 (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: E2E 리포트
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
